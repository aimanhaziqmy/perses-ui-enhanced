{{- if and .Values.alertmanager .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'

    receivers:
      - name: 'default-receiver'
        {{- if and .Values.alertmanager.receivers .Values.alertmanager.receivers.defaultWebhookUrl }}
        webhook_configs:
          - url: {{ .Values.alertmanager.receivers.defaultWebhookUrl | quote }}
            send_resolved: true
        {{- end }}
        {{- if and .Values.alertmanager.receivers .Values.alertmanager.receivers.slackApiUrl }}
        slack_configs:
          - api_url: {{ .Values.alertmanager.receivers.slackApiUrl | quote }}
            channel: {{ default "#alerts" .Values.alertmanager.receivers.slackChannel | quote }}
            send_resolved: true
        {{- end }}
{{- end }}
