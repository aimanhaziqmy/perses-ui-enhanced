{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlcollector-victoria-logs-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: victoria-logs-collector
    app.kubernetes.io/instance: vlcollector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-collector
      app.kubernetes.io/instance: vlcollector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs-collector
        app.kubernetes.io/instance: vlcollector
    spec:
      serviceAccountName: vlcollector-victoria-logs-collector
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - -envflag.enable=true
            - -envflag.prefix=VL_
            - -remoteWrite.url=http://vl-victoria-logs-single-server:9428
            - -tmpDataPath=/var/lib/vl-collector
            - -loggerFormat=json
            - -kubernetesCollector=true
            - -kubernetesCollector.includePodLabels=true
            - -kubernetesCollector.includePodAnnotations=false
            - -kubernetesCollector.includeNodeLabels=false
            - -kubernetesCollector.includeNodeAnnotations=false
            - -kubernetesCollector.msgField=message,msg,log
            - -kubernetesCollector.streamFields=kubernetes.container_name,kubernetes.pod_name,kubernetes.pod_namespace
            - -fileCollector.checkpointsPath=/var/lib/vl-collector/file-checkpoints.json
            - -fileCollector.hostnameField=collector_pod
            - -fileCollector.streamFields=stream,hostname,log_type
            {{- range .Values.collector.fileCollector }}
            - -fileCollector.glob={{ .glob }}
            - -fileCollector.extraFields={{ .extraFields | quote }}
            {{- end }}
            {{- if and .Values.collector.k8sAudit .Values.collector.k8sAudit.enabled }}
            - -fileCollector.glob={{ .Values.collector.k8sAudit.glob }}
            - -fileCollector.extraFields={{ .Values.collector.k8sAudit.extraFields | quote }}
            - -fileCollector.msgField=requestURI,message,msg,log
            {{- end }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlib
              mountPath: /var/lib
              readOnly: true
            - name: collector-data
              mountPath: /var/lib/vl-collector
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlib
          hostPath:
            path: /var/lib
        - name: collector-data
          hostPath:
            path: /var/lib/vl-collector
            type: DirectoryOrCreate
{{- end }}

