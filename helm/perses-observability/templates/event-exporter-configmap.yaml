{{- if .Values.eventExporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-event-exporter
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    logLevel: info
    logFormat: json
    omitLookup: true
    metricsNamePrefix: "event_exporter_"
    kubeQPS: 100
    kubeBurst: 100
    route:
      routes:
        - match:
            - reason: "LeaderElection"
              drop: true
            - reason: ".*"
          receivers:
            - victorialogs
    receivers:
      - name: victorialogs
        webhook:
          endpoint: "http://{{ include "perses-observability.victoriaLogs.serviceName" . }}:9428/insert/jsonline?_stream_fields=stream,namespace,reason,type&_msg_field=message&_time_field=timestamp"
          headers:
            Content-Type: "application/json"
          layout:
            stream: "k8s_events"
            namespace: '{{`{{ or .InvolvedObject.Namespace "cluster" }}`}}'
            reason: '{{`{{ .Reason }}`}}'
            type: '{{`{{ .Type }}`}}'
            kind: '{{`{{ .InvolvedObject.Kind }}`}}'
            name: '{{`{{ .InvolvedObject.Name }}`}}'
            message: '{{`{{ .Message }}`}}'
            component: '{{`{{ .Source.Component }}`}}'
            host: '{{`{{ .Source.Host }}`}}'
            count: '{{`{{ .Count }}`}}'
            timestamp: '{{`{{ or .GetTimestampISO8601 .CreationTimestamp.String }}`}}'
{{- end }}

