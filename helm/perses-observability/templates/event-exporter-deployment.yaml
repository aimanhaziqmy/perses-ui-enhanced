{{- if .Values.eventExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-event-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: k8s-event-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-event-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-event-exporter
    spec:
      serviceAccountName: k8s-event-exporter
      containers:
        - name: event-exporter
          image: "{{ .Values.eventExporter.image.repository }}:{{ .Values.eventExporter.image.tag }}"
          imagePullPolicy: {{ .Values.eventExporter.image.pullPolicy }}
          args:
            - -conf=/data/config.yaml
          ports:
            - name: metrics
              containerPort: 2112
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 2112
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 2112
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /data
          resources:
            {{- toYaml .Values.eventExporter.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: k8s-event-exporter
{{- end }}
