{{- if .Values.jaeger.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ default "jaeger" .Values.jaeger.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: query
      port: {{ .Values.jaeger.service.queryPort }}
      targetPort: query
      protocol: TCP
    - name: otlp-grpc
      port: {{ .Values.jaeger.service.otlpGrpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.jaeger.service.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
{{- end }}
