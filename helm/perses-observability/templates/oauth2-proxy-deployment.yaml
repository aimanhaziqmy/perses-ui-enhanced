{{- if .Values.oauth2Proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}"
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          args:
            - --provider=oidc
            - --client-id={{ .Values.oauth2Proxy.clientId }}
            - --code-challenge-method=S256
            - --oidc-issuer-url={{ .Values.oauth2Proxy.issuerUrl }}
            - --insecure-oidc-skip-issuer-verification={{ default false .Values.oauth2Proxy.insecureOidcSkipIssuerVerification }}
            - --insecure-oidc-allow-unverified-email={{ default false .Values.oauth2Proxy.insecureOidcAllowUnverifiedEmail }}
            - --ssl-insecure-skip-verify={{ default false .Values.oauth2Proxy.sslInsecureSkipVerify }}
            {{- if .Values.oauth2Proxy.caSecretName }}
            - --provider-ca-file=/etc/oauth2-proxy/ca/{{ default "ca.crt" .Values.oauth2Proxy.caSecretKey }}
            {{- end }}
            - --login-url={{ .Values.oauth2Proxy.loginUrl }}
            - --redeem-url={{ .Values.oauth2Proxy.redeemUrl }}
            - --oidc-jwks-url={{ .Values.oauth2Proxy.jwksUrl }}
            - --redirect-url={{ .Values.oauth2Proxy.redirectUrl }}
            - --cookie-name=_vl_oauth2
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=24h
            - --email-domain=*
            - --upstream=http://vmauth-victoria-metrics-auth:8427
            - --http-address=0.0.0.0:4180
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --pass-authorization-header=true
            - --oidc-groups-claim=groups
            - --pass-user-headers=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vlogs-oidc-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: vlogs-oidc-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
          {{- if .Values.oauth2Proxy.caSecretName }}
          volumeMounts:
            - name: oidc-ca
              mountPath: /etc/oauth2-proxy/ca
              readOnly: true
      volumes:
        - name: oidc-ca
          secret:
            secretName: {{ .Values.oauth2Proxy.caSecretName }}
          {{- end }}
{{- end }}

