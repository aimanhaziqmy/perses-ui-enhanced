{{- if .Values.observabilityUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perses-ui-enhanced
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-ui
spec:
  replicas: {{ .Values.observabilityUi.replicaCount }}
  selector:
    matchLabels:
      app: perses-ui-enhanced
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: perses-ui-enhanced
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: observability-ui
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/observability-ui-nginx-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.observabilityUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observability-ui
          image: "{{ .Values.observabilityUi.image.repository }}:{{ .Values.observabilityUi.image.tag }}"
          imagePullPolicy: {{ .Values.observabilityUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.observabilityUi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: perses-ui-enhanced-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
