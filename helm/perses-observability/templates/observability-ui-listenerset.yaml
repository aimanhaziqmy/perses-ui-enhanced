{{- $ls := .Values.observabilityUi.listenerSet | default dict -}}
{{- if and .Values.observabilityUi.enabled .Values.observabilityUi.httpRoute.enabled $ls.enabled }}
{{- $secretName := default "perses-ui-tls" $ls.tlsSecretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $host := .Values.observabilityUi.httpRoute.hostname }}
{{- $ips := list }}
{{- $dns := list }}
{{- if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $host }}
  {{- $ips = list $host }}
{{- else }}
  {{- $dns = list $host }}
{{- end }}
{{- $cert := genSelfSignedCert $host $ips $dns 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ default "perses-ui" $ls.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ default "external" $ls.gatewayName }}
    namespace: {{ default "gateway-system" $ls.gatewayNamespace }}
  listeners:
    - name: {{ default "https-ui" $ls.sectionName }}
      port: {{ default 50811 $ls.port }}
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $secretName }}
{{- end }}
