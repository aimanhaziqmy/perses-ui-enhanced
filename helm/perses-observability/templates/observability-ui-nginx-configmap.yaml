{{- if .Values.observabilityUi.enabled }}
{{- $persesSvc := printf "%s.%s.svc.cluster.local:8080" (default (printf "%s-perses" .Release.Name) .Values.perses.fullnameOverride) .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-ui-enhanced-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
data:
  default.conf: |
    js_import audit from /etc/nginx/njs/audit.js;
    js_set $audit_actor audit.extractActor;
    js_set $is_authenticated audit.isAuthenticated;

    map "$request_method:$request_uri" $is_perses_audit {
      default 0;
      ~^(POST|PUT|PATCH|DELETE): 1;
      ~^GET:/api/auth/logout 1;
      ~^GET:/proxy/.*/select/logsql/ 1;
    }

    log_format perses_audit escape=json
      '{"audit_type":"perses_api","timestamp":"$time_iso8601","actor":"$audit_actor","method":"$request_method","uri":"$request_uri","status":$status,"remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for","user_agent":"$http_user_agent","request_time":$request_time}';

    server {
      listen 8080;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location = /workspace-map.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        root /tmp;
        try_files /workspace-map.json @workspace_disabled;
      }

      location @workspace_disabled {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        return 200 '{"enabled":false,"data":{"items":[]}}\n';
      }

      location = /api/v1/health {
        proxy_pass http://{{ $persesSvc }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location = /api/v1/globalvariables/perses-ui-site-settings {
        set $auth_check "1";
        if ($request_method != GET) {
          set $auth_check "${is_authenticated}";
        }
        if ($auth_check = "0") {
          return 401;
        }
        access_log /dev/stdout perses_audit if=$is_perses_audit;
        proxy_pass http://{{ $persesSvc }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /api/v1/ {
        if ($is_authenticated = "0") {
          return 401;
        }
        access_log /dev/stdout perses_audit if=$is_perses_audit;
        proxy_pass http://{{ $persesSvc }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
      }

      location /api/ {
        access_log /dev/stdout perses_audit if=$is_perses_audit;
        proxy_pass http://{{ $persesSvc }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
      }

      location /proxy/ {
        if ($is_authenticated = "0") {
          return 401;
        }
        access_log /dev/stdout perses_audit if=$is_perses_audit;
        proxy_pass http://{{ $persesSvc }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
      }

      location /plugins/ {
        proxy_pass http://{{ $persesSvc }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
{{- end }}
