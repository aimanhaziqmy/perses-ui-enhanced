{{- if and .Values.subcharts.persesEnabled (not .Values.persesAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: perses-auth-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
type: Opaque
stringData:
  encryption-key: "{{ .Values.persesAuth.encryptionKey }}"
  client-secret: "{{ .Values.persesAuth.oidcClientSecret }}"
{{- end }}

