{{- if .Values.subcharts.persesEnabled }}
{{- $vmUrl := printf "http://%s.%s.svc.cluster.local:8428" (include "perses-observability.victoriaMetrics.serviceName" .) .Release.Namespace }}
{{- $vlUrl := .Values.victoriaLogs.serviceUrl }}
{{- $useVmauth := or .Values.vmauth.enabled (ne (default "" .Values.vmauth.externalUrl) "") }}
{{- if .Values.vmauth.enabled }}
{{- $vlUrl = printf "http://%s.%s.svc.cluster.local:8427" (include "perses-observability.vmauth.serviceName" .) .Release.Namespace }}
{{- else if .Values.vmauth.externalUrl }}
{{- $vlUrl = .Values.vmauth.externalUrl }}
{{- else if .Values.victoriaLogs.enabled }}
{{- $vlUrl = printf "http://%s.%s.svc.cluster.local:9428" (include "perses-observability.victoriaLogs.serviceName" .) .Release.Namespace }}
{{- end }}
{{- $vt := .Values.victoriaTraces | default dict -}}
{{- $vtSvc := $vt.service | default dict -}}
{{- $vtUrl := printf "http://%s.%s.svc.cluster.local:%d/select/jaeger" (default "victoria-traces" $vtSvc.name) .Release.Namespace (int (default 10428 $vtSvc.httpPort)) }}
{{- $jaeger := .Values.jaeger | default dict -}}
{{- $jaegerSvc := $jaeger.service | default dict -}}
{{- $jaegerUrl := printf "http://%s.%s.svc.cluster.local:%d" (default "jaeger" $jaegerSvc.name) .Release.Namespace (int (default 16686 $jaegerSvc.queryPort)) }}
{{- $hasUsers := .Values.persesProvisioning.bootstrapUsers }}
{{- $hasDatasources := and .Values.persesProvisioning.enabled .Values.persesProvisioning.seedDatasources }}
{{- $hasProjects := and .Values.persesProvisioning.enabled .Values.persesProvisioning.seedProjects }}
{{- $hasDashboards := and .Values.persesProvisioning.enabled .Values.persesProvisioning.seedProjects .Values.persesProvisioning.seedDashboards }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perses-observability.labels" . | nindent 4 }}
{{- if not (or $hasUsers $hasDatasources $hasProjects $hasDashboards) }}
data: {}
{{- else }}
data:
  {{- if $hasUsers }}
  01-users.json: |
    [
      {
        "kind": "User",
        "metadata": {
          "name": {{ .Values.persesAuth.nativeAdminUsername | quote }}
        },
        "spec": {
          "nativeProvider": {
            "password": {{ .Values.persesAuth.nativeAdminPassword | quote }}
          }
        }
      },
      {
        "kind": "GlobalRole",
        "metadata": {
          "name": "admin"
        },
        "spec": {
          "permissions": [
            {
              "actions": ["*"],
              "scopes": ["*"]
            }
          ]
        }
      },
      {
        "kind": "GlobalRole",
        "metadata": {
          "name": "editor"
        },
        "spec": {
          "permissions": [
            {
              "actions": ["*"],
              "scopes": ["Dashboard", "Datasource", "EphemeralDashboard", "Folder", "Project", "Variable"]
            },
            {
              "actions": ["read"],
              "scopes": ["GlobalDatasource", "GlobalVariable", "Role", "RoleBinding"]
            }
          ]
        }
      },
      {
        "kind": "GlobalRole",
        "metadata": {
          "name": "viewer"
        },
        "spec": {
          "permissions": [
            {
              "actions": ["read"],
              "scopes": ["Dashboard", "Datasource", "EphemeralDashboard", "Folder", "Project", "Variable", "GlobalDatasource", "GlobalVariable"]
            }
          ]
        }
      },
      {
        "kind": "GlobalRoleBinding",
        "metadata": {
          "name": "admin"
        },
        "spec": {
          "role": "admin",
          "subjects": [
            {
              "kind": "User",
              "name": {{ .Values.persesAuth.nativeAdminUsername | quote }}
            }
            {{- range .Values.persesAuth.extraAdminUsers }}
            ,{
              "kind": "User",
              "name": {{ . | quote }}
            }
            {{- end }}
          ]
        }
      }
    ]
  {{- end }}
  {{- if $hasDatasources }}
  02-globaldatasources.json: |
    [
      {{- if $useVmauth }}
      {
        "kind": "GlobalSecret",
        "metadata": {
          "name": "vmauth-perses-secret"
        },
        "spec": {
          "basicAuth": {
            "username": {{ default "perses-readonly" .Values.vmauth.persesUsername | quote }},
            "password": {{ default "changeme-perses-vmauth" .Values.vmauth.persesPassword | quote }}
          }
        }
      },
      {{- end }}
      {
        "kind": "GlobalDatasource",
        "metadata": {
          "name": "VictoriaMetrics"
        },
        "spec": {
          "default": true,
          "display": {
            "name": "VictoriaMetrics"
          },
          "plugin": {
            "kind": "PrometheusDatasource",
            "spec": {
              "proxy": {
                "kind": "HTTPProxy",
                "spec": {
                  "url": {{ $vmUrl | quote }}
                }
              }
            }
          }
        }
      },
      {
        "kind": "GlobalDatasource",
        "metadata": {
          "name": "VictoriaLogs"
        },
        "spec": {
          "default": true,
          "display": {
            "name": "VictoriaLogs"
          },
          "plugin": {
            "kind": "VictoriaLogsDatasource",
            "spec": {
              "proxy": {
                "kind": "HTTPProxy",
                "spec": {
                  "url": {{ $vlUrl | quote }}{{- if $useVmauth }},
                  "secret": "vmauth-perses-secret"
                  {{- end }}
                }
              }
            }
          }
        }
      }
      {{- if $vt.enabled }},
      {
        "kind": "GlobalDatasource",
        "metadata": {
          "name": "VictoriaTraces"
        },
        "spec": {
          "default": true,
          "display": {
            "name": "VictoriaTraces"
          },
          "plugin": {
            "kind": "JaegerDatasource",
            "spec": {
              "proxy": {
                "kind": "HTTPProxy",
                "spec": {
                  "url": {{ $vtUrl | quote }}
                }
              }
            }
          }
        }
      }
      {{- end }}
      {{- if $jaeger.enabled }},
      {
        "kind": "GlobalDatasource",
        "metadata": {
          "name": "Jaeger"
        },
        "spec": {
          "default": {{ not (default false $vt.enabled) }},
          "display": {
            "name": "Jaeger"
          },
          "plugin": {
            "kind": "JaegerDatasource",
            "spec": {
              "proxy": {
                "kind": "HTTPProxy",
                "spec": {
                  "url": {{ $jaegerUrl | quote }}
                }
              }
            }
          }
        }
      }
      {{- end }}
    ]
  {{- end }}
  {{- if $hasProjects }}
  03-project.json: |
    [
      {
        "kind": "Project",
        "metadata": {
          "name": {{ .Values.persesProvisioning.projectName | quote }}
        },
        "spec": {
          "display": {
            "name": {{ .Values.persesProvisioning.projectDisplayName | quote }}
          }
        }
      }
    ]
  {{- end }}
  {{- if $hasDashboards }}
  04-dashboards.json: |
    [
      {
        "kind": "Dashboard",
        "metadata": {
          "name": "cluster-node-gpu-metrics",
          "project": {{ .Values.persesProvisioning.projectName | quote }}
        },
        "spec": {
          "display": {
            "name": "Cluster, Node & NVIDIA GPU Telemetry"
          },
          "duration": "1h",
          "refreshInterval": "30s",
          "variables": [],
          "panels": {
            "cpuUtilization": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Node CPU Utilization (%)",
                  "description": "Per-node CPU usage across cluster nodes"
                },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "legend": {
                      "position": "bottom"
                    },
                    "visual": {
                      "areaOpacity": 0.2,
                      "lineWidth": 2
                    },
                    "yAxis": {
                      "show": true,
                      "min": 0,
                      "max": 100,
                      "format": {
                        "unit": "percent"
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "seriesNameFormat": "{{`{{node}}`}}",
                          "query": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "memoryUtilization": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Node Memory Utilization (%)",
                  "description": "Physical memory used across cluster nodes"
                },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "legend": {
                      "position": "bottom"
                    },
                    "visual": {
                      "areaOpacity": 0.2,
                      "lineWidth": 2
                    },
                    "yAxis": {
                      "show": true,
                      "min": 0,
                      "max": 100,
                      "format": {
                        "unit": "percent"
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "seriesNameFormat": "{{`{{node}}`}}",
                          "query": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "gpuUtilization": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "NVIDIA GPU Utilization (%)",
                  "description": "NVIDIA DCGM GPU compute utilization (%)"
                },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "legend": {
                      "position": "bottom"
                    },
                    "visual": {
                      "areaOpacity": 0.2,
                      "lineWidth": 2
                    },
                    "yAxis": {
                      "show": true,
                      "min": 0,
                      "max": 100,
                      "format": {
                        "unit": "percent"
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "seriesNameFormat": "{{`{{node}} - {{modelName}}`}}",
                          "query": "DCGM_FI_DEV_GPU_UTIL"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "gpuMemoryUsed": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "NVIDIA GPU VRAM Used (MiB)",
                  "description": "Framebuffer memory allocated on cluster GPUs"
                },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "legend": {
                      "position": "bottom"
                    },
                    "visual": {
                      "areaOpacity": 0.2,
                      "lineWidth": 2
                    },
                    "yAxis": {
                      "show": true,
                      "format": {
                        "unit": "bytes",
                        "shortValues": true
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "seriesNameFormat": "{{`{{node}} - {{modelName}}`}}",
                          "query": "DCGM_FI_DEV_FB_USED * 1048576"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "gpuTemp": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Peak GPU Temperature (°C)"
                },
                "plugin": {
                  "kind": "GaugeChart",
                  "spec": {
                    "calculation": "last-number",
                    "max": 100,
                    "format": {
                      "unit": "decimal",
                      "decimalPlaces": 1
                    },
                    "thresholds": {
                      "steps": [
                        { "value": 70 },
                        { "value": 85 }
                      ]
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "query": "max(DCGM_FI_DEV_GPU_TEMP)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "runningPods": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Running Kubernetes Pods"
                },
                "plugin": {
                  "kind": "StatChart",
                  "spec": {
                    "calculation": "last-number",
                    "format": {
                      "unit": "decimal",
                      "decimalPlaces": 0
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "query": "count(kube_pod_status_phase{phase=\"Running\"} == 1)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "clusterUptime": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Cluster Uptime"
                },
                "plugin": {
                  "kind": "StatChart",
                  "spec": {
                    "calculation": "last-number",
                    "format": {
                      "unit": "seconds",
                      "decimalPlaces": 0
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "query": "time() - min(node_boot_time_seconds)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "clusterMemoryTotal": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Total Cluster RAM"
                },
                "plugin": {
                  "kind": "StatChart",
                  "spec": {
                    "calculation": "last-number",
                    "format": {
                      "unit": "bytes",
                      "decimalPlaces": 1
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "query": "sum(node_memory_MemTotal_bytes)"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "vlogsIngestionRate": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "VictoriaLogs Active Streams / Ingestion"
                },
                "plugin": {
                  "kind": "StatChart",
                  "spec": {
                    "calculation": "last-number",
                    "format": {
                      "unit": "decimal",
                      "decimalPlaces": 1,
                      "shortValues": true
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "PrometheusTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "PrometheusDatasource",
                            "name": "VictoriaMetrics"
                          },
                          "query": "sum(rate(vl_rows_ingested_total[5m]))"
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          "layouts": [
            {
              "kind": "Grid",
              "spec": {
                "display": {
                  "title": "Basic Info",
                  "collapse": { "open": true }
                },
                "items": [
                  { "x": 0, "y": 0, "width": 6, "height": 5, "content": { "$ref": "#/spec/panels/clusterUptime" } },
                  { "x": 6, "y": 0, "width": 6, "height": 5, "content": { "$ref": "#/spec/panels/runningPods" } },
                  { "x": 12, "y": 0, "width": 6, "height": 5, "content": { "$ref": "#/spec/panels/clusterMemoryTotal" } },
                  { "x": 18, "y": 0, "width": 6, "height": 5, "content": { "$ref": "#/spec/panels/vlogsIngestionRate" } }
                ]
              }
            },
            {
              "kind": "Grid",
              "spec": {
                "display": {
                  "title": "Compute & Memory",
                  "collapse": { "open": true }
                },
                "items": [
                  { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/cpuUtilization" } },
                  { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/memoryUtilization" } }
                ]
              }
            },
            {
              "kind": "Grid",
              "spec": {
                "display": {
                  "title": "NVIDIA GPU Telemetry",
                  "collapse": { "open": true }
                },
                "items": [
                  { "x": 0, "y": 0, "width": 10, "height": 8, "content": { "$ref": "#/spec/panels/gpuUtilization" } },
                  { "x": 10, "y": 0, "width": 10, "height": 8, "content": { "$ref": "#/spec/panels/gpuMemoryUsed" } },
                  { "x": 20, "y": 0, "width": 4, "height": 8, "content": { "$ref": "#/spec/panels/gpuTemp" } }
                ]
              }
            }
          ]
        }
      },
      {
        "kind": "Dashboard",
        "metadata": {
          "name": "logs-and-k8s-events",
          "project": {{ .Values.persesProvisioning.projectName | quote }}
        },
        "spec": {
          "display": {
            "name": "Unified VictoriaLogs & Kubernetes Events"
          },
          "duration": "1h",
          "refreshInterval": "30s",
          "variables": [],
          "panels": {
            "logVolumeByStream": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Log Volume Over Time (LogsQL)",
                  "description": "Cluster log rate from VictoriaLogs"
                },
                "plugin": {
                  "kind": "TimeSeriesChart",
                  "spec": {
                    "legend": {
                      "position": "bottom"
                    },
                    "visual": {
                      "areaOpacity": 0.2,
                      "lineWidth": 2
                    },
                    "yAxis": {
                      "show": true,
                      "format": {
                        "unit": "decimal",
                        "shortValues": true
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TimeSeriesQuery",
                    "spec": {
                      "plugin": {
                        "kind": "VictoriaLogsTimeSeriesQuery",
                        "spec": {
                          "datasource": {
                            "kind": "VictoriaLogsDatasource",
                            "name": "VictoriaLogs"
                          },
                          "query": "* | stats by (kubernetes.pod_namespace) count() as logs"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "k8sWarningEvents": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Kubernetes Lifecycle Events (k8s_events)",
                  "description": "Cluster scheduling, OOMKilled, Evicted, and Normal events"
                },
                "plugin": {
                  "kind": "LogsTable",
                  "spec": {
                    "allowWrap": true,
                    "enableDetails": true,
                    "showTime": true
                  }
                },
                "queries": [
                  {
                    "kind": "LogQuery",
                    "spec": {
                      "plugin": {
                        "kind": "VictoriaLogsLogQuery",
                        "spec": {
                          "datasource": {
                            "kind": "VictoriaLogsDatasource",
                            "name": "VictoriaLogs"
                          },
                          "query": "stream:=\"k8s_events\" | sort by (_time desc) | limit 100"
                        }
                      }
                    }
                  }
                ]
              }
            },
            "recentClusterLogs": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Recent Cluster & Host Logs",
                  "description": "Live LogsQL stream across pods, kernel, and systemd"
                },
                "plugin": {
                  "kind": "LogsTable",
                  "spec": {
                    "allowWrap": true,
                    "enableDetails": true,
                    "showTime": true
                  }
                },
                "queries": [
                  {
                    "kind": "LogQuery",
                    "spec": {
                      "plugin": {
                        "kind": "VictoriaLogsLogQuery",
                        "spec": {
                          "datasource": {
                            "kind": "VictoriaLogsDatasource",
                            "name": "VictoriaLogs"
                          },
                          "query": "* | sort by (_time desc) | limit 100"
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          "layouts": [
            {
              "kind": "Grid",
              "spec": {
                "display": {
                  "title": "VictoriaLogs Ingestion Volume",
                  "collapse": { "open": true }
                },
                "items": [
                  { "x": 0, "y": 0, "width": 24, "height": 8, "content": { "$ref": "#/spec/panels/logVolumeByStream" } }
                ]
              }
            },
            {
              "kind": "Grid",
              "spec": {
                "display": {
                  "title": "Live Log Streams",
                  "collapse": { "open": true }
                },
                "items": [
                  { "x": 0, "y": 0, "width": 24, "height": 10, "content": { "$ref": "#/spec/panels/k8sWarningEvents" } },
                  { "x": 0, "y": 10, "width": 24, "height": 10, "content": { "$ref": "#/spec/panels/recentClusterLogs" } }
                ]
              }
            }
          ]
        }
      }
      {{- if $vt.enabled }},
      {
        "kind": "Dashboard",
        "metadata": {
          "name": "victoriatraces-tracing",
          "project": {{ .Values.persesProvisioning.projectName | quote }}
        },
        "spec": {
          "display": {
            "name": "VictoriaTraces Distributed Tracing"
          },
          "duration": "1h",
          "refreshInterval": "0s",
          "variables": [
            {
              "kind": "TextVariable",
              "spec": {
                "name": "service",
                "value": "",
                "display": {
                  "name": "Service",
                  "description": "Service name for trace search (required when Trace ID is empty)"
                }
              }
            },
            {
              "kind": "TextVariable",
              "spec": {
                "name": "operation",
                "value": "",
                "display": {
                  "name": "Operation",
                  "description": "Optional span operation filter"
                }
              }
            },
            {
              "kind": "TextVariable",
              "spec": {
                "name": "minDuration",
                "value": "",
                "display": {
                  "name": "Min Duration",
                  "description": "Optional minimum duration (e.g. 50ms, 1s)"
                }
              }
            },
            {
              "kind": "TextVariable",
              "spec": {
                "name": "traceId",
                "value": "",
                "display": {
                  "name": "Trace ID",
                  "description": "16 or 32 hex character Trace ID for Gantt waterfall"
                }
              }
            }
          ],
          "panels": {
            "traceSearchTable": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Trace Search Results",
                  "description": "Traces matching Service, Operation, and Min Duration filters in VictoriaTraces"
                },
                "plugin": {
                  "kind": "TraceTable",
                  "spec": {
                    "visual": {
                      "palette": {
                        "mode": "auto"
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TraceQuery",
                    "spec": {
                      "plugin": {
                        "kind": "JaegerTraceQuery",
                        "spec": {
                          "datasource": {
                            "kind": "JaegerDatasource",
                            "name": "VictoriaTraces"
                          },
                          "service": "$service",
                          "operation": "$operation",
                          "minDuration": "$minDuration",
                          "limit": 50
                        }
                      }
                    }
                  }
                ]
              }
            },
            "traceGanttWaterfall": {
              "kind": "Panel",
              "spec": {
                "display": {
                  "name": "Trace Span Waterfall",
                  "description": "Gantt timeline of spans for the selected Trace ID ($traceId)"
                },
                "plugin": {
                  "kind": "TracingGanttChart",
                  "spec": {
                    "visual": {
                      "palette": {
                        "mode": "auto"
                      }
                    }
                  }
                },
                "queries": [
                  {
                    "kind": "TraceQuery",
                    "spec": {
                      "plugin": {
                        "kind": "JaegerTraceQuery",
                        "spec": {
                          "datasource": {
                            "kind": "JaegerDatasource",
                            "name": "VictoriaTraces"
                          },
                          "traceId": "$traceId"
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          "layouts": [
            {
              "kind": "Grid",
              "spec": {
                "display": {
                  "title": "VictoriaTraces Search & Waterfall",
                  "collapse": { "open": true }
                },
                "items": [
                  { "x": 0, "y": 0, "width": 24, "height": 10, "content": { "$ref": "#/spec/panels/traceSearchTable" } },
                  { "x": 0, "y": 10, "width": 24, "height": 12, "content": { "$ref": "#/spec/panels/traceGanttWaterfall" } }
                ]
              }
            }
          ]
        }
      }
      {{- end }}
    ]
  {{- end }}
{{- end }}
{{- end }}

