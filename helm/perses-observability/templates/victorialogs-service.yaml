{{- if .Values.victoriaLogs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perses-observability.victoriaLogs.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: victoria-logs-single
    app.kubernetes.io/instance: vl
    app: server
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 9428
      targetPort: 9428
      protocol: TCP
  selector:
    app.kubernetes.io/name: victoria-logs-single
    app.kubernetes.io/instance: vl
    app: server
{{- end }}

