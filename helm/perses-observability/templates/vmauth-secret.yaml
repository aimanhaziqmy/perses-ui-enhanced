{{- if and .Values.vmauth.enabled (not .Values.vmauth.existingSecret) }}
{{- $vlUrl := printf "http://%s:9428" (include "perses-observability.victoriaLogs.serviceName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: vmauth-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  auth.yml: |
    users:
      - username: "admin"
        password: "{{ .Values.vmauth.adminPassword }}"
        url_map:
          - src_paths: ["/.*"]
            url_prefix: "{{ $vlUrl }}"

      - username: "{{ default "perses-readonly" .Values.vmauth.persesUsername }}"
        password: "{{ default "changeme-perses-vmauth" .Values.vmauth.persesPassword }}"
        url_map:
          - src_paths: ["/.*"]
            deny_paths:
              - "/delete.*"
              - "/internal/.*"
              - "/insert.*"
            url_prefix: "{{ $vlUrl }}"

      {{- if .Values.vmauth.enterpriseEnabled }}
      # Enterprise-only vmauth header/filter routing (requires VictoriaMetrics Enterprise vmauth)
      - src_headers:
          - "X-Forwarded-Groups: platform-admin"
        url_map:
          - src_paths: ["/.*"]
            url_prefix: "{{ $vlUrl }}"

      {{- range .Values.vmauth.tenants }}
      - src_headers:
          - "X-Forwarded-Groups: workspace-{{ .workspace }}"
        url_map:
          - src_paths: ["/.*"]
            deny_paths:
              - "/delete.*"
              - "/internal/.*"
              - "/insert.*"
            url_prefix: "{{ $vlUrl }}"
            extra_filters:
              - '(kubernetes.pod_namespace:="{{ .workspace }}" OR namespace:="{{ .workspace }}")'
      {{- end }}
      {{- end }}

    unauthorized_user:
      url_map:
        - src_paths:
            - "/select/vmui/.*"
            - "/select/vmui"
          url_prefix: "{{ $vlUrl }}"
{{- end }}

